volumes:
  data:
  images:

services:
  wallabag:
    image: wallabag/wallabag:latest
    container_name: wallabag
    hostname: wallabag
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
    ports:
      - "127.0.0.1:${INTERNAL_PORT}:80"
    volumes:
      - data:/var/www/wallabag/data
      - images:/var/www/wallabag/web/assets/images
    env_file:
      - .env
    environment:
      SYMFONY__ENV__DATABASE_DRIVER: pdo_sqlite
      SYMFONY__ENV__DOMAIN_NAME: https://${PUBLIC_HOST}:${PUBLIC_PORT}
      SYMFONY__ENV__SERVER_NAME: ${SERVER_NAME}
      SYMFONY__ENV__SECRET: ${WALLABAG_SECRET}
      SYMFONY__ENV__FOSUSER_REGISTRATION: "false"
      SYMFONY__ENV__FOSUSER_CONFIRMATION: "false"
      SYMFONY__ENV__LOCALE: en
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--user-agent", "healthcheck", "http://localhost/api/info"]
      timeout: 10s
      start_period: 60s
      start_interval: 11s
      interval: 75s
      retries: 3
