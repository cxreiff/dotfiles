# Non-secret tailnet identity. Read by every script that needs it; never hardcode TAILNET or TAILNET_DNS_SUFFIX (NODE_HOSTNAME is fixed; see below).
TAILNET=cxreiff.github          # API name (tailscale status --json .CurrentTailnet.Name)
TAILNET_DNS_SUFFIX=faun-fir.ts.net
NODE_HOSTNAME=cxmini            # this Mac's tailnet device name, fixed at cxmini (hardcoded in connectome lint, the cxagents smoke and policy hosts.cxmini); doctor (self-name and policy hosts checks) is its only reader
